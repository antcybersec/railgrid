{{ template "header.html" . }}

<div class="theme-panel">
  <h1 class="theme-heading">Sign in to Railgrid</h1>
  <p class="dex-subtitle">Choose a provider to continue.</p>
  <div class="login-providers">
    {{ range $c := .Connectors }}
      <div class="theme-form-row">
        <a class="dex-btn theme-btn-provider" href="{{ $c.URL }}" target="_self">
          <span class="dex-btn-icon dex-btn-icon--{{ $c.Type }}" aria-hidden="true"></span>
          <span class="dex-btn-text">Sign in with {{ $c.Name }}</span>
        </a>
      </div>
    {{ end }}
  </div>
  <p class="dex-footer-text">By signing in you agree to the Railgrid terms and privacy policy.</p>
</div>

{{ template "footer.html" . }}
