# Provider — declarative provisioning record (admin.railgrid.ai, admin-only).
# The hub's Provider controller creates root:railgrid:providers:kuery, its
# "provider" ServiceAccount, and the kuery-kubeconfig Secret in
# root:railgrid:system:providers. The APIExport/schemas/bind-grant come from kuery's own
# `init`; routing/UI from the companion CatalogEntry in manifest.yaml.
apiVersion: admin.railgrid.ai/v1alpha1
kind: Provider
metadata:
  name: kuery
spec:
  displayName: "Kuery"
