# Provider — declarative provisioning record (admin.railgrid.ai, admin-only).
# The hub's Provider controller creates root:railgrid:providers:code, its
# "provider" ServiceAccount, and the code-kubeconfig Secret in
# root:railgrid:system:providers. The APIExport/schemas/bind-grant come from code's own
# `init`; routing/UI from the companion CatalogEntry in manifest.yaml.
apiVersion: admin.railgrid.ai/v1alpha1
kind: Provider
metadata:
  name: code
spec:
  displayName: "Code"
