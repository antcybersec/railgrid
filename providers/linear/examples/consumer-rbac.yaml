apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linear-consumer
rules:
  - apiGroups: [linear.providers.faros.sh]
    resources: [connections, teams]
    verbs: [get, list]
  - apiGroups: [linear.providers.faros.sh]
    resources: [teams/states, teams/issues, teams/issue, teams/comments, teams/replies]
    verbs: [invoke]
  - apiGroups: [linear.providers.faros.sh]
    resources: [teams/create_issue, teams/update_issue, teams/add_comment]
    verbs: [invoke]
# Bind in the tenant workspace. Use resourceNames to restrict actions to specific
# registered Team names. Omit write actions for read-only consumers.
