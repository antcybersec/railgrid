apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linear-consumer
rules:
  - apiGroups: [linear.providers.faros.sh]
    resources: [connections, teams, events]
    verbs: [get, list, watch]
  - apiGroups: [linear.providers.faros.sh]
    resources: [operations]
    verbs: [get, list, watch, create]
# Bind this ClusterRole with a ClusterRoleBinding in the tenant workspace.
# Operation creators can use every Connection in that workspace. Workspace
# administrators manage Connection policy and Secrets. Do not grant consumers status writes.
