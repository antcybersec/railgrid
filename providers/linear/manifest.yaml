apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: linear
spec:
  displayName: Linear
  description: "Registered Linear Teams and resource-bound issue actions."
  vendor: faros
  version: "0.1.0"
  category: Developer
  iconURL: /ui/providers/linear/icon.svg
  ui:
    url: http://localhost:8092
    indexPath: /
    children:
      - displayName: Connections
        builtinRoute: connections
      - displayName: Teams
        builtinRoute: teams
  backend:
    url: http://localhost:8092
    healthPath: /readyz
  apiExport:
    name: linear.providers.faros.sh
    permissionClaims:
      - resource: secrets
        verbs: [get]
        tenantScoped: true
  actions:
  - id: states/v1
    displayName: States
    description: Use a registered Linear Team. Returns a bounded current observation
      without persistence.
    boundResource:
      apiVersion: linear.providers.faros.sh/v1alpha1
      kind: Team
      resource: teams
    inputSchema:
      type: object
      properties:
        first:
          type: integer
          minimum: 1
          maximum: 50
        after:
          type: string
          maxLength: 4096
      additionalProperties: false
    outputSchema:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          enum:
          - Running
          - Succeeded
          - Failed
          - Uncertain
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        connectionUID:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: false
    schemaDigest: sha256:b2d1cc571e5876da6c4e5319d3e430e2f0ff041de23fd856063b83e2373c1b8c
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 25
      maxInputBytes: 32768
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: issues/v1
    displayName: Issues
    description: Use a registered Linear Team. Returns a bounded current observation
      without persistence.
    boundResource:
      apiVersion: linear.providers.faros.sh/v1alpha1
      kind: Team
      resource: teams
    inputSchema:
      type: object
      properties:
        first:
          type: integer
          minimum: 1
          maximum: 50
        after:
          type: string
          maxLength: 4096
        query:
          type: string
          maxLength: 1000
        since:
          type: string
          format: date-time
      additionalProperties: false
    outputSchema:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          enum:
          - Running
          - Succeeded
          - Failed
          - Uncertain
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        connectionUID:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: false
    schemaDigest: sha256:55700073a7e1417e851ba288308f5d5e854728ea93a3a5018c0972a0410c5aaf
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 25
      maxInputBytes: 32768
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: issue/v1
    displayName: Issue
    description: Use a registered Linear Team. Returns a bounded current observation
      without persistence.
    boundResource:
      apiVersion: linear.providers.faros.sh/v1alpha1
      kind: Team
      resource: teams
    inputSchema:
      type: object
      properties:
        issueID:
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false
      required:
      - issueID
    outputSchema:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          enum:
          - Running
          - Succeeded
          - Failed
          - Uncertain
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        connectionUID:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: false
    schemaDigest: sha256:75ed0ea79e4b470d9c6b2dd33be7366868fd70b148cfe9b1df5364bac9646cd0
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 25
      maxInputBytes: 32768
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: comments/v1
    displayName: Comments
    description: Use a registered Linear Team. Returns a bounded current observation
      without persistence.
    boundResource:
      apiVersion: linear.providers.faros.sh/v1alpha1
      kind: Team
      resource: teams
    inputSchema:
      type: object
      properties:
        issueID:
          type: string
          minLength: 1
          maxLength: 255
        first:
          type: integer
          minimum: 1
          maximum: 50
        after:
          type: string
          maxLength: 4096
      additionalProperties: false
      required:
      - issueID
    outputSchema:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          enum:
          - Running
          - Succeeded
