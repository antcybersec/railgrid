          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 16000
        stateID:
          type: string
          maxLength: 255
      additionalProperties: false
      required:
      - issueID
    outputSchema:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          enum:
          - Running
          - Succeeded
          - Failed
          - Uncertain
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        connectionUID:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: false
    schemaDigest: sha256:631adb552223bf84525adc1198d8074c5ac41bb82450bc98716c03ba7d30a9fd
    executionMode: sync
