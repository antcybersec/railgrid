  - id: create_issue/v1
    displayName: Create issue
    description: Use a registered Linear Team. Retain the stable write key to inspect
      uncertain outcomes.
    boundResource:
      apiVersion: linear.providers.faros.sh/v1alpha1
      kind: Team
      resource: teams
    inputSchema:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
