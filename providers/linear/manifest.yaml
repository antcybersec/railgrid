    description: Use a registered Linear Team. Returns a bounded current observation
      without persistence.
    boundResource:
      apiVersion: linear.providers.faros.sh/v1alpha1
      kind: Team
      resource: teams
    inputSchema:
      type: object
      properties:
        issueID:
          type: string
          minLength: 1
          maxLength: 255
        commentID:
          type: string
          minLength: 1
          maxLength: 255
        first:
          type: integer
          minimum: 1
          maximum: 50
        after:
          type: string
          maxLength: 4096
      additionalProperties: false
      required:
      - issueID
      - commentID
    outputSchema:
      type: object
      required:
      - phase
      properties:
        phase:
          type: string
          enum:
          - Running
          - Succeeded
          - Failed
          - Uncertain
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        connectionUID:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: false
    schemaDigest: sha256:5e811e27126d15433f3327d866bc68934cc5ff9361cb42e0ae75f6b1fcceee24
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 25
      maxInputBytes: 32768
