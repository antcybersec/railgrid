          - Uncertain
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        connectionUID:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: false
    schemaDigest: sha256:f395fd081cf37551053d1168a8a505db9b3dfce1940d4ae518c503a9baafd99a
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 25
      maxInputBytes: 32768
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: replies/v1
