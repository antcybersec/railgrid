apiVersion: v2
name: railgrid-infrastructure-provider
description: |
  railgrid provider that brokers application templates from a central kro
  (Kube Resource Orchestrator) cluster into railgrid tenant workspaces.
  Ships the provider Deployment, ClusterIP Service, the
  central-kro-cluster kubeconfig Secret (optional, dev convenience),
  and the CatalogEntry that registers the provider with the railgrid hub.
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://example.com/kro-icon.png
keywords:
  - railgrid
  - kro
  - multicluster
  - templates
home: https://github.com/railgrid/railgrid
sources:
  - https://github.com/railgrid/railgrid/tree/main/providers/infrastructure
maintainers:
  - name: railgrid maintainers
