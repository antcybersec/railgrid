# Provider — declarative provisioning record (admin.railgrid.ai, admin-only).
# The hub's Provider controller creates root:railgrid:providers:infrastructure, its
# "provider" ServiceAccount, and the infrastructure-kubeconfig Secret in
# root:railgrid:system:providers. The APIExport/schemas/bind-grant come from the
# provider's own `init`; routing/UI from the companion CatalogEntry in
# manifest.yaml.
apiVersion: admin.railgrid.ai/v1alpha1
kind: Provider
metadata:
  name: infrastructure
spec:
  displayName: "Application Templates"
