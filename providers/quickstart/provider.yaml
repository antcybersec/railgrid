# Provider — declarative provisioning record (admin.railgrid.ai, admin-only).
# Applied into root:railgrid:system:providers. The hub's Provider controller creates the
# provider sub-workspace (root:railgrid:providers:quickstart), its "provider"
# ServiceAccount, and writes a kubeconfig Secret (quickstart-kubeconfig) into
# root:railgrid:system:providers. Nothing else — the APIExport/schemas/bind-grant come
# from the provider's own `init`, and routing/UI from the companion
# CatalogEntry in manifest.yaml.
apiVersion: admin.railgrid.ai/v1alpha1
kind: Provider
metadata:
  name: quickstart
spec:
  displayName: "Quickstart"
