apiVersion: v2
name: railgrid-quickstart-provider
description: |
  Reference railgrid provider demonstrating the platform's extension surface
  end-to-end. Ships the provider Deployment, ClusterIP Service, and the
  CatalogEntry that registers the provider (UI + backend + a sample
  greetings APIExport) with the railgrid hub. Pure broker — no kcp or kro
  kubeconfig wiring; useful as a copy-from template for new providers.
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://example.com/railgrid-icon.png
keywords:
  - railgrid
  - provider
  - quickstart
  - reference
home: https://github.com/railgrid/railgrid
sources:
  - https://github.com/railgrid/railgrid/tree/main/providers/quickstart
maintainers:
  - name: railgrid maintainers
