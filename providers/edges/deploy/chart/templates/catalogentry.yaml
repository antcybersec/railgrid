{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the railgrid hub (routing + portal
# Enable flow). It is a kcp resource (providers.railgrid.ai/v1alpha1), so it
# MUST NOT be applied to the hosting cluster. The chart renders it into a
# ConfigMap that the init container mounts and applies into the provider
# workspace via the provider kubeconfig (RAILGRID_CATALOGENTRY_FILE ->
# sdkinstall.Bootstrap). backend.url points at the in-cluster Service so the hub
# backend proxy forwards /services/providers/edges/* (agent ingress + edgeproxy)
# here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edges.fullname" . }}-catalogentry
  labels:
    {{- include "edges.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.railgrid.ai/v1alpha1
    kind: CatalogEntry
    metadata:
      name: edges
    spec:
      displayName: "Edges"
      description: "Connect and manage Kubernetes clusters, Linux/SSH servers, and macOS hosts as edges: kubectl and SSH where supported, host-local Services through the hub reverse tunnel, plus the edge MCP endpoint."
      vendor: "railgrid"
      version: {{ .Chart.AppVersion | quote }}
      category: "Edges"
      iconURL: "/ui/providers/edges/icon.svg"
      # Grants the provider SA get/list/watch/proxy on the edge kinds in the
      # tenant workspace on Enable (join-token validation + SSH creds reads).
      edgeProxyAccess: true
      ui:
        url: "http://{{ include "edges.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
        # Sub-nav items under the Edges parent in the sidebar. Must match
        # manifest.yaml. Workloads → /providers/edges/workloads;
        # Services → /providers/edges/services.
        children:
          - displayName: Workloads
            builtinRoute: workloads
          - displayName: Services
            builtinRoute: services
      backend:
        url: "http://{{ include "edges.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/healthz"
      apiExport:
        name: "edges.providers.railgrid.ai"
        permissionClaims:
          - group: ""
            resource: namespaces
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - group: ""
            resource: serviceaccounts
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - group: ""
            resource: secrets
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - group: rbac.authorization.k8s.io
            resource: clusterroles
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - group: rbac.authorization.k8s.io
            resource: clusterrolebindings
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          # Delegated authn/authz for the data plane (kcp#4279 / kcp#4280): the
          # provider validates presented tokens and authorizes the resolved
          # identity against the consumer workspace via the APIExport VW. Must
          # match manifest.yaml + init_cmd.go. tenantScoped: the VW confines each
          # review to the tenant's OWN workspace (bounded → auto-acceptable, no
          # "reach beyond your workspace" warning). Built-in review APIs: create only.
          - group: authentication.k8s.io
            resource: tokenreviews
            verbs: [create]
            tenantScoped: true
          - group: authorization.k8s.io
            resource: subjectaccessreviews
            verbs: [create]
            tenantScoped: true
      # Lets an organization run edges in its own cluster (docs/byo-providers.md).
      # Mirrors manifest.yaml — keep both in sync.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/railgrid/charts"
          name: "railgrid-edges-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "railgrid-provider-edges"
        releaseName: "edges"
        docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/edges/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
        requiredValues:
          - name: hub.externalURL
            value: "{{`{{hubURL}}`}}"
            description: >-
              Address baked into every agent kubeconfig this provider mints, so
              agents reach kcp through the hub. Derived from the hub's own
              external URL; override only if your agents reach railgrid at a
              different address.
{{- end }}
