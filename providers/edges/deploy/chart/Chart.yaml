apiVersion: v2
name: railgrid-edges-provider
description: |
  Standalone railgrid provider for edges — both Kubernetes clusters and Linux/SSH
  servers, under one group edges.railgrid.ai. Terminates the agent reverse
  tunnel (revdial) in-process, owns the connectable APIs + their
  APIExport, and exposes kubectl/SSH/MCP through the hub backend proxy. Ships the
  provider Deployment (horizontally scalable — each agent dials one replica and
  a Lease registry + pod-to-pod relay route requests to the tunnel's owner), a
  ClusterIP Service, and the CatalogEntry that registers the provider with the
  railgrid hub.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - railgrid
  - provider
  - edges
  - kubernetes
  - servers
home: https://github.com/railgrid/railgrid
sources:
  - https://github.com/railgrid/railgrid/tree/main/providers/edges
maintainers:
  - name: railgrid maintainers
