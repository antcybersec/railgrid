# Provider — declarative provisioning record (admin.railgrid.ai, admin-only).
# The hub's Provider controller creates root:railgrid:providers:agents, its
# "provider" ServiceAccount, and the agents-kubeconfig Secret in
# root:railgrid:system:providers. The APIExport/schemas/bind-grant come from the
# agents provider's own `init`; routing/UI from the companion CatalogEntry
# (Helm-rendered from deploy/chart/templates/catalogentry.yaml).
apiVersion: admin.railgrid.ai/v1alpha1
kind: Provider
metadata:
  name: agents
spec:
  displayName: "Agents"
